    <text x="155" y="366" font-weight="700">Technik</text><text x="320" y="366">Astro und GitHub Pages</text>
    <text x="155" y="420" font-weight="700">Ton</text><text x="320" y="420">Konkret, Schweizer Rechtschreibung</text>
