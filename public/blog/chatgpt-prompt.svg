  </g>
  <circle cx="967" cy="260" r="94" fill="#1556a6"/>
  <path d="M923 241h88v60h-36l-24 22 5-22h-33z" fill="none" stroke="#fffefb" stroke-width="7" stroke-linejoin="round"/>
  <path d="M942 259h50M942 279h33" stroke="#f1b846" stroke-width="6" stroke-linecap="round"/>
