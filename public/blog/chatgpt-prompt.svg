<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Briefing für einen Coding-Agenten</title>
  <desc id="desc">Ein Agentenfenster zeigt Ziel, Publikum, Inhalt und Arbeitsweise für den PICTS-Blog.</desc>
  <rect width="1200" height="650" rx="32" fill="#10254a"/>
  <rect x="68" y="55" width="1064" height="540" rx="22" fill="#fffefb"/>
  <rect x="68" y="55" width="1064" height="62" rx="22" fill="#e9e2d5"/>
  <circle cx="105" cy="86" r="8" fill="#c56643"/><circle cx="132" cy="86" r="8" fill="#f1b846"/><circle cx="159" cy="86" r="8" fill="#63cbd4"/>
  <text x="600" y="94" fill="#10254a" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="700">Coding-Agent · picts-blog</text>
  <rect x="118" y="155" width="710" height="365" rx="20" fill="#e8f2f4"/>
  <g fill="#10254a" font-family="Arial, sans-serif" font-size="24">
